<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — {{site_title}}</title>
<meta name="description" content="{{description}}">
<style>
body {
  margin: 0 auto;
  max-width: 38rem;
  padding: 2rem 1rem;
  font: 16px/1.6 system-ui, sans-serif;
}
header {
  margin-bottom: 2rem;
}
header a {
  color: inherit;
  font-weight: 600;
  text-decoration: none;
}
time {
  opacity: 0.7;
}
pre {
  padding: 1rem;
  overflow-x: auto;
  background: rgb(127 127 127 / 15%);
}
code,
pre {
  font-family: ui-monospace, monospace;
  font-size: 0.9em;
}
img {
  max-width: 100%;
}
table {
  border-collapse: collapse;
}
th,
td {
  border: 1px solid rgb(127 127 127 / 40%);
  padding: 0.2rem 0.5rem;
}
blockquote {
  margin-left: 0;
  padding-left: 1rem;
  border-left: 3px solid rgb(127 127 127 / 40%);
}
</style>
</head>
<body>
<header><a href="/">{{site_title}}</a></header>
<main>
<h1>{{title}}</h1>
<p><time datetime="{{date}}">{{date}}</time></p>
{{content}}
</main>
</body>
</html>
